<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heat Sentinel - Ward Risk Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script>
        // Initialize map centered on Delhi (change coordinates to your target city)
        const map = L.map('map').setView([28.6139, 77.2090], 12);

        // Add the base map tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Dummy ward data (replace with real GeoJSON later)
const wards = [
    {
        name: "Ward 1 - Connaught Place",
        forecast: ["Extreme", "High", "High", "Moderate", "Moderate", "Low"],
        coords: [[28.635, 77.215], [28.635, 77.225], [28.625, 77.225], [28.625, 77.215]]
    },
    {
        name: "Ward 2 - Karol Bagh",
        forecast: ["High", "Extreme", "Extreme", "High", "Moderate", "Moderate"],
        coords: [[28.655, 77.185], [28.655, 77.195], [28.645, 77.195], [28.645, 77.185]]
    },
    {
        name: "Ward 3 - Dwarka",
        forecast: ["Moderate", "Moderate", "High", "High", "Extreme", "High"],
        coords: [[28.595, 77.035], [28.595, 77.055], [28.575, 77.055], [28.575, 77.035]]
    },
    {
        name: "Ward 4 - Rohini",
        forecast: ["Low", "Low", "Moderate", "Moderate", "Moderate", "High"],
        coords: [[28.735, 77.105], [28.735, 77.125], [28.715, 77.125], [28.715, 77.105]]
    }
];

let currentDay = 0; // 0 = Today, 1 = +1 day, etc.
let wardLayers = []; // stores each polygon so we can update it later

// Color mapping for each risk level
function getColor(risk) {
    const colors = {
        "Low": "green",
        "Moderate": "gold",
        "High": "orange",
        "Extreme": "red"
    };
    return colors[risk] || "gray";
}

// Draw each ward as a colored polygon
// Draw each ward as a colored polygon
wards.forEach(ward => {
    const risk = ward.forecast[currentDay];
    const polygon = L.polygon(ward.coords, {
        color: 'white',
        weight: 1,
        fillColor: getColor(risk),
        fillOpacity: 0.6
    }).addTo(map);

    polygon.bindPopup(`<b>${ward.name}</b><br>Risk Level: ${risk}`);
    wardLayers.push(polygon);
});

// Updates all ward colors/popups when the selected day changes
function updateWards(dayIndex) {
    currentDay = dayIndex;
    wards.forEach((ward, i) => {
        const risk = ward.forecast[dayIndex];
        wardLayers[i].setStyle({ fillColor: getColor(risk) });
        wardLayers[i].setPopupContent(`<b>${ward.name}</b><br>Risk Level: ${risk}`);
    });
}

// Add a color legend to the map
const legend = L.control({ position: 'bottomright' });

legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.style.background = 'white';
    div.style.padding = '10px';
    div.style.borderRadius = '8px';
    div.style.boxShadow = '0 0 5px rgba(0,0,0,0.3)';
    div.style.fontFamily = 'Arial, sans-serif';
    div.style.fontSize = '13px';

    const risks = ['Low', 'Moderate', 'High', 'Extreme'];
    let html = '<b>Risk Level</b><br>';

    risks.forEach(risk => {
        html += `<i style="background:${getColor(risk)}; width:14px; height:14px; display:inline-block; margin-right:6px; border-radius:3px;"></i>${risk}<br>`;
    });

    div.innerHTML = html;
    return div;
};

legend.addTo(map);
// Add day selector control
const dayControl = L.control({ position: 'topright' });

dayControl.onAdd = function () {
    const div = L.DomUtil.create('div', 'day-selector');
    div.style.background = 'white';
    div.style.padding = '8px';
    div.style.borderRadius = '8px';
    div.style.boxShadow = '0 0 5px rgba(0,0,0,0.3)';
    div.style.fontFamily = 'Arial, sans-serif';

    const labels = ['Today', '+1', '+2', '+3'];
    let html = '<b>Forecast Day</b><br>';

    labels.forEach((label, i) => {
        html += `<button onclick="updateWards(${i})" style="margin:3px; padding:4px 8px; cursor:pointer;">${label}</button>`;
    });

    div.innerHTML = html;
    L.DomEvent.disableClickPropagation(div);
    return div;
};

dayControl.addTo(map);
// Load real transit heat exposure data
Papa.parse('data/transit_stops refined.csv', {
    download: true,
    header: true,
    dynamicTyping: true,

    complete: function(results) {
        const stops = results.data.filter(
            row => row.city === 'Delhi' && row.lat && row.lon
        );

        stops.forEach(stop => {
            const color = getColor(stop.thei_tier);

            L.circleMarker([stop.lat, stop.lon], {
                radius: 5,
                fillColor: color,
                color: 'white',
                weight: 1,
                fillOpacity: 0.8
            })
            .addTo(map)
            .bindPopup(`
                <b>${stop.name}</b><br>
                Mode: ${stop.mode}<br>
                THEI Score: ${stop.thei}<br>
                Risk: ${stop.thei_tier}
            `);
        });

        console.log(`Loaded ${stops.length} real Delhi transit stops`);
    },

    error: function(error) {
        console.error("Error loading refined dataset:", error);
    }
});
    </script>

</body>
</html>
